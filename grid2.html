<!DOCTYPE html>
<html>
<head>
    <title>Chess Board</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #333;
            font: 16px Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            width: 480px;
            margin: 20px auto;
            border: 5px solid white;
        }

        .square {
            width: 60px;
            height: 60px;
            text-align: center;
            line-height: 60px;
            font-size: 40px;
        }

        .white {
            background: white;
        }

        .black {
            background: black;
        }

        .black-piece {
            color: black;
            text-shadow: 0 0 2px white;
        }

        .white-piece {
            color: white;
            text-shadow: 0 0 2px black;
        }
    </style>
</head>
<body>

    <h1>Chess Board</h1>

    <div class="board">
        <div class="square black black-piece">&#9820;</div>
        <div class="square white black-piece">&#9822;</div>
        <div class="square black black-piece">&#9821;</div>
        <div class="square white black-piece">&#9819;</div>
        <div class="square black black-piece">&#9818;</div>
        <div class="square white black-piece">&#9821;</div>
        <div class="square black black-piece">&#9822;</div>
        <div class="square white black-piece">&#9820;</div>

        <div class="square white black-piece">&#9823;</div>
        <div class="square black black-piece">&#9823;</div>
        <div class="square white black-piece">&#9823;</div>
        <div class="square black black-piece">&#9823;</div>
        <div class="square white black-piece">&#9823;</div>
        <div class="square black black-piece">&#9823;</div>
        <div class="square white black-piece">&#9823;</div>
        <div class="square black black-piece">&#9823;</div>

        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <div class="square black white-piece">&#9817;</div>
        <div class="square white white-piece">&#9817;</div>
        <div class="square black white-piece">&#9817;</div>
        <div class="square white white-piece">&#9817;</div>
        <div class="square black white-piece">&#9817;</div>
        <div class="square white white-piece">&#9817;</div>
        <div class="square black white-piece">&#9817;</div>
        <div class="square white white-piece">&#9817;</div>

        <div class="square white white-piece">&#9814;</div>
        <div class="square black white-piece">&#9816;</div>
        <div class="square white white-piece">&#9815;</div>
        <div class="square black white-piece">&#9813;</div>

        <div class="square black white-piece">&#9815;</div>
        <div class="square white white-piece">&#9816;</div>
        <div class="square black white-piece">&#9814;</div>
    </div>

</body>
</html>
